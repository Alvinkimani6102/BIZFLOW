<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit {{ service.name }} - BIZFLOW</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="navbar-container">

            <a
                href="{{ url_for('dashboard') }}"
                class="brand"
            >
                BIZFLOW
            </a>

            <div class="nav-links">

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('logout') }}">
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- EDIT SERVICE -->

    <main class="edit-service-page">

        <div class="edit-service-container">

            <!-- BACK LINK -->

            <a
                href="{{ url_for(
                    'view_service',
                    business_id=business._id,
                    service_id=service._id
                ) }}"
                class="edit-service-back"
            >
                ← Back to Service
            </a>


            <!-- HEADER -->

            <div class="edit-service-header">

                <h1>
                    Edit Service
                </h1>

                <p>
                    Update the information for
                    <strong>{{ service.name }}</strong>.
                </p>

            </div>


            <!-- FORM -->

            <form
                class="edit-service-form"
                action="{{ url_for(
                    'edit_service',
                    business_id=business._id,
                    service_id=service._id
                ) }}"
                method="POST"
            >

                <!-- SERVICE NAME -->

                <div class="form-group">

                    <label for="name">
                        Service Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ service.name }}"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ service.category }}"
                        placeholder="e.g. IT Services"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the service..."
                    >{{ service.description }}</textarea>

                </div>


                <!-- COST -->

                <div class="form-group">

                    <label for="cost">
                        Service Cost (KSh)
                    </label>

                    <input
                        type="number"
                        id="cost"
                        name="cost"
                        min="0"
                        step="0.01"
                        value="{{ service.cost }}"
                        required
                    >

                    <small class="form-help">
                        The cost your business incurs
                        when providing this service.
                    </small>

                </div>


                <!-- CUSTOMER PRICE -->

                <div class="form-group">

                    <label for="selling_price">
                        Customer Price (KSh)
                    </label>

                    <input
                        type="number"
                        id="selling_price"
                        name="selling_price"
                        min="0"
                        step="0.01"
                        value="{{ service.selling_price }}"
                        required
                    >

                    <small class="form-help">
                        The amount charged to the customer.
                    </small>

                </div>


                <!-- DURATION -->

                <div class="form-group">

                    <label for="duration">
                        Duration
                    </label>

                    <input
                        type="text"
                        id="duration"
                        name="duration"
                        value="{{ service.duration }}"
                        placeholder="e.g. 2 hours, 3 days, 1 week"
                        required
                    >

                </div>


                <!-- AVAILABILITY -->

                <div class="edit-service-availability">

                    <label
                        for="available"
                        class="availability-label"
                    >

                        <input
                            type="checkbox"
                            id="available"
                            name="available"
                            {% if service.available %}
                                checked
                            {% endif %}
                        >

                        Service is currently available

                    </label>

                </div>


                <!-- ACTION BUTTONS -->

                <div class="edit-service-actions">

                    <button
                        type="submit"
                        class="edit-service-save"
                    >
                        Save Changes
                    </button>


                    <a
                        href="{{ url_for(
                            'view_service',
                            business_id=business._id,
                            service_id=service._id
                        ) }}"
                        class="edit-service-cancel"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
