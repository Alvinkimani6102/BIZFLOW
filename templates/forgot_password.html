
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery | BIZFLOW</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .recovery-container {
            max-width: 450px;
            margin: 70px auto;
            padding: 32px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .recovery-container h1 {
            margin-bottom: 10px;
            color: #172554;
        }

        .recovery-container p {
            color: #64748b;
            line-height: 1.6;
        }

        .recovery-container label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
        }

        .recovery-container input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .recovery-container button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .recovery-message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .recovery-error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .recovery-back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="recovery-container">
    <h1>Account Recovery</h1>

    <p>
        Enter the email address registered to your BIZFLOW account.
        Your password reset must be approved by the BIZFLOW administrator.
    </p>

    <form method="POST"
          action="{{ url_for('forgot_password') }}">

        <label for="email">Registered Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="new_password">New Password</label>

<input
    type="password"
    id="new_password"
    name="new_password"
    placeholder="Enter your new password"
    minlength="8"
    autocomplete="new-password"
    required
>

<label for="confirm_password">Confirm New Password</label>

<input
    type="password"
    id="confirm_password"
    name="confirm_password"
    placeholder="Confirm your new password"
    minlength="8"
    autocomplete="new-password"
    required
>

        <button type="submit">Request Password Reset</button>
    </form>

    {% if error %}
        <div class="recovery-message recovery-error">
            {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="recovery-message">
            {{ success }}
        </div>
    {% endif %}

    <a class="recovery-back"
       href="{{ url_for('login') }}">
        Back to Login
    </a>
</div>

</body>
</html>
