<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | BIZFLOW</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

          
<style>
.password-wrapper {
    position: relative;
    width: 100%;
}

.password-wrapper input {
    width: 100%;
    box-sizing: border-box;
    padding-right: 48px;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    padding: 5px;
}
</style>


</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <a href="/" class="brand">

            <img
                src="{{ url_for('static', filename='images/bizflow-logo.webp') }}"
                alt="BIZFLOW Logo"
            >

        </a>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/login">
                Login
            </a>

        </nav>

    </header>


    <!-- Signup Section -->

    <main class="signup-page">

        <div class="signup-container">

            <h1>
                Create Your BIZFLOW Account
            </h1>

            <p class="signup-description">

                Create your account and start managing
                your businesses from one place.

            </p>


            <!-- Signup Form -->

            <form action="/signup" method="POST">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    
<div class="password-wrapper">
    <input
        type="password"
        id="signup-password"
        name="password"
        placeholder="Enter your password"
        required
    >
    <button
        type="button"
        class="toggle-password"
        onclick="togglePassword('signup-password', this)"
        aria-label="Show password"
        title="Show password"
    >👁</button>
</div>



                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit" class="signup-submit">

                    Create Account

                </button>

            </form>


            <p class="login-text">

                Already have a BIZFLOW account?

                <a href="{{ url_for('login') }}" class="login-link">Login</a>

            </p>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <img
            src="{{ url_for('static', filename='images/bizflow-logo.webp') }}"
            alt="BIZFLOW"
            class="footer-logo"
        >

        <p>
            © 2026 BIZFLOW. All rights reserved.
        </p>

        <p class="footer-tagline">
            Manage • Track • Grow
        </p>

    </footer>


    
<script>
function togglePassword(inputId, button) {
    const passwordInput = document.getElementById(inputId);

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        button.textContent = "🙈";
        button.setAttribute("aria-label", "Hide password");
        button.setAttribute("title", "Hide password");
    } else {
        passwordInput.type = "password";
        button.textContent = "👁";
        button.setAttribute("aria-label", "Show password");
        button.setAttribute("title", "Show password");
    }
}
</script>


</body>

</html>
