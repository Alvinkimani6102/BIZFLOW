
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | BIZFLOW</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fc;
            color: #172554;
        }

        .maintenance-card {
            width: 100%;
            max-width: 540px;
            padding: 45px 32px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
        }

        .maintenance-icon {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border-radius: 22px;
            background: #dbeafe;
            color: #2563eb;
            font-size: 36px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 30px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.8;
        }

        .brand {
            margin-top: 28px;
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <main class="maintenance-card">
        <div class="maintenance-icon" aria-hidden="true">⚙</div>

        <h1>We'll Be Back Soon</h1>

        <p>
            BIZFLOW is temporarily undergoing scheduled maintenance
            to improve your experience.
        </p>

        <p>
            Please check back later. Thank you for your patience.
        </p>

        <div class="brand">BIZFLOW</div>
    </main>
</body>
</html>
